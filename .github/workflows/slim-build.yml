name: Slim APK Build

on:
  workflow_dispatch:

jobs:
  build_slim:
    name: Build arm64 ${{ matrix.variant }} Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [Foss, Gms]
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build slim release
        run: ./gradlew assembleArm64${{ matrix.variant }}Release --no-configuration-cache --console=plain --warning-mode summary

      - name: Report APK size
        run: ls -lh app/build/outputs/apk/arm64${{ matrix.variant }}/release/*.apk

      - name: Upload slim APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-${{ matrix.variant }}-release
          path: app/build/outputs/apk/arm64${{ matrix.variant }}/release/*.apk
          retention-days: 7
